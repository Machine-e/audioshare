name: audioshare
description: Use a Windows PC as a Bluetooth A2DP audio receiver.
publish_to: 'none'
version: 0.2.7+9

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/misans/MiSans-Regular.otf
          weight: 400
        - asset: assets/fonts/misans/MiSans-Medium.otf
          weight: 500
        - asset: assets/fonts/misans/MiSans-Semibold.otf
          weight: 600
